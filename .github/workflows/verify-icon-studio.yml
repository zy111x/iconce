name: Verify Icon Studio

on:
  push:
    branches:
      - feat/icon-studio-vercel
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime
        run: node --version && npm --version
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
